# Sem a chave, a aplicação não sobe: em produção os tokens precisam sobreviver a um restart.
game-log.auth.jwt-private-key=${JWT_PRIVATE_KEY}
# Render e Cloud Run ficam atrás de um proxy: o IP real do cliente (usado no limite de login) vem no X-Forwarded-For.
server.forward-headers-strategy=native
# O plano gratuito do Neon aceita poucas conexões; o Hikari abriria 10.
spring.datasource.hikari.maximum-pool-size=5
# Logs em JSON, um evento por linha, para a plataforma de hospedagem indexar.
logging.structured.format.console=ecs
