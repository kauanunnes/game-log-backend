spring.config.import=optional:file:.env[.properties]
spring.flyway.locations=classpath:db/migration,classpath:db/seed
spring.jpa.show-sql=true

# Embeddings com o all-MiniLM-L6-v2 (ONNX) dentro da API, só para testar. A primeira subida baixa o modelo (~90 MB), e
# o primeiro cálculo, a biblioteca nativa do PyTorch. Para desligar: SPRING_AI_MODEL_EMBEDDING=none
spring.ai.model.embedding=transformers
spring.ai.embedding.transformer.tokenizer.options.padding=true
spring.ai.embedding.transformer.tokenizer.options.truncation=true
spring.ai.embedding.transformer.tokenizer.options.maxLength=256
