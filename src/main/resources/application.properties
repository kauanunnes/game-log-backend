spring.application.name=game-log
spring.profiles.default=local
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=50

game-log.igdb.client-id=${IGDB_CLIENT_ID:}
game-log.igdb.client-secret=${IGDB_CLIENT_SECRET:}

game-log.auth.jwt-private-key=${JWT_PRIVATE_KEY:}

# Sem SPRING_MAIL_HOST, os e-mails vão para o log (desenvolvimento).
game-log.mail.from=${MAIL_FROM:Game Log <nao-responda@gamelog.dev>}
game-log.mail.app-url=${APP_URL:http://localhost:5173}

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
