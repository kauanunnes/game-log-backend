spring.application.name=game-log
spring.profiles.default=local
spring.threads.virtual.enabled=true
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.data.web.pageable.max-page-size=50

# Caches em memória (Caffeine); cada um está descrito em shared/Caches
spring.cache.cache-names=lookups,stats
spring.cache.caffeine.spec=maximumSize=10000,expireAfterWrite=10m,recordStats

# Embeddings dos jogos (Fase 3): por enquanto só no perfil local, com um modelo dentro da API, para testar
spring.ai.model.embedding=none
game-log.embeddings.model=all-MiniLM-L6-v2

# Um modelo escolhe e explica as sugestões (3.5): o Gemini, por padrão, ou o Claude, com AI_PROVIDER=claude.
# Sem a chave do escolhido, elas ficam só com a busca.
game-log.ai.provider=${AI_PROVIDER:gemini}
game-log.ai.gemini.api-key=${GEMINI_API_KEY:}
game-log.ai.claude.api-key=${ANTHROPIC_API_KEY:}

# O traceId vai em toda linha de log (Micrometer Tracing); as métricas ficam em /actuator/metrics, só para admins
management.endpoints.web.exposure.include=health,metrics

game-log.igdb.client-id=${IGDB_CLIENT_ID:}
game-log.igdb.client-secret=${IGDB_CLIENT_SECRET:}

game-log.auth.jwt-private-key=${JWT_PRIVATE_KEY:}

# Sem SPRING_MAIL_HOST, os e-mails vão para o log (desenvolvimento).
game-log.mail.from=${MAIL_FROM:Game Log <nao-responda@gamelog.dev>}
game-log.mail.app-url=${APP_URL:http://localhost:5173}

cors.origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}
